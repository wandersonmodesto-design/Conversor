<body>
    <h3>feito por:</h3>

        <header>
            <h1>Conversor de Moedas🪙</h1>

        <label for="valor">Valor em Reais (R$):</label>
        <input type="number" id="valor" placeholder="Digite o valor em reais">

            <option value="eur">Real para Euro</option>
            <option value="gbp">Real para Libra Esterlina</option>
            <option value="jpy">Real para Iene Japonês</option>
            
        </select>
